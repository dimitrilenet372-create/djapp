<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le bac, tes playlists SoundCloud rangées</title>
  <meta name="description" content="Ajoute tes playlists SoundCloud, retire les doublons en un clic et recrée la version propre sur ton compte.">
  <meta name="theme-color" content="#1d38f5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d38f5'/%3E%3Crect x='6' y='7' width='6' height='5' rx='1.5' fill='%23ffd84d'/%3E%3Crect x='13' y='7' width='6' height='5' rx='1.5' fill='%23ff9cc2'/%3E%3Crect x='20' y='7' width='6' height='5' rx='1.5' fill='%235fd6b0'/%3E%3Crect x='6' y='14' width='20' height='11' rx='2' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
  <meta name="app-version" content="2026-10-31-f">
  <link rel="stylesheet" href="style.css?v=2026-10-31-f">
</head>
<body>
  <header class="top" id="top">
    <div class="top-inner">
      <button type="button" id="back" class="back" hidden>‹ Mes playlists</button>
      <h1 class="wordmark">Le bac</h1>
      <p class="pitch" id="pitch">Tes playlists SoundCloud, sans doublons, prêtes pour tes sets.</p>
      <button type="button" id="add" class="btn btn-go">Ajouter une playlist</button>
    </div>
  </header>

  <main>
    <section id="home" aria-label="Mes playlists">
      <div id="start" class="start" hidden>
        <p>Aucune playlist pour l'instant. Ajoute la première : elle s'affiche ici comme dans une app de musique.</p>
        <button type="button" id="start-demo" class="link">Essayer avec un exemple</button>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="detail" aria-label="Playlist" hidden>
      <div class="hero">
        <div id="hero-cover" class="cover cover-lg" aria-hidden="true"></div>
        <div class="hero-info">
          <label class="sr-only" for="pl-name">Nom de la playlist</label>
          <input id="pl-name" class="pl-name" maxlength="60">
          <p id="pl-meta" class="pl-meta"></p>
          <div class="hero-actions">
            <button type="button" id="clean" class="btn btn-solid"></button>
            <button type="button" id="recreate" class="btn btn-line">Recréer sur SoundCloud</button>
          </div>
          <div class="hero-more">
            <button type="button" id="split" class="link">Ranger par style</button>
            <button type="button" id="export" class="link">Exporter en CSV</button>
            <button type="button" id="delete" class="link danger">Supprimer</button>
          </div>
        </div>
      </div>
      <div id="notice" class="notice" role="status" hidden></div>
      <ol id="tracks" class="tracks"></ol>
    </section>
    <p class="foot">Le bac · version <span id="version"></span><span id="stale" hidden> · ta page est en cache, recharge avec Ctrl+F5</span></p>
  </main>

  <div id="homebar" class="selbar" hidden>
    <span id="homebar-text"></span>
    <button type="button" class="btn btn-go" id="hb-compare">Comparer</button>
    <button type="button" class="btn btn-go" id="hb-merge">Fusionner</button>
    <button type="button" class="btn btn-ghost" id="hb-clear">Annuler</button>
  </div>

  <div id="player" class="player" hidden>
    <div class="player-now">
      <span id="p-thumb" class="thumb" aria-hidden="true"></span>
      <span class="trk-main"><span id="p-title" class="trk-title"></span><span id="p-artist" class="trk-artist"></span></span>
    </div>
    <div class="player-ctl">
      <button type="button" id="p-prev" class="ctl" aria-label="Titre précédent">⏮</button>
      <button type="button" id="p-toggle" class="ctl ctl-main" aria-label="Lecture ou pause">▶</button>
      <button type="button" id="p-next" class="ctl" aria-label="Titre suivant">⏭</button>
    </div>
    <iframe id="p-frame" class="player-frame" title="Lecteur SoundCloud" height="72" allow="autoplay"></iframe>
    <div class="player-extra">
      <button type="button" id="p-ideas" class="link">Idées d'enchaînement</button>
      <a id="p-open" class="link" href="#" target="_blank" rel="noopener">Ouvrir sur SoundCloud</a>
      <button type="button" id="p-close" class="ctl" aria-label="Fermer le lecteur">×</button>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button type="button" id="sheet-x" class="sheet-x" aria-label="Fermer">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- une seule version pour tous les scripts : le navigateur ne peut pas mélanger ancien et nouveau code -->
  <script type="importmap">
  {
    "imports": {
      "./js/app.js": "./js/app.js?v=2026-10-31-f",
      "./js/core.js": "./js/core.js?v=2026-10-31-f",
      "./js/library.js": "./js/library.js?v=2026-10-31-f",
      "./js/bookmarklet.js": "./js/bookmarklet.js?v=2026-10-31-f",
      "./js/sample.js": "./js/sample.js?v=2026-10-31-f",
      "./js/zip.js": "./js/zip.js?v=2026-10-31-f"
    }
  }
  </script>
  <script type="module" src="js/app.js?v=2026-10-31-f"></script>
</body>
</html>
